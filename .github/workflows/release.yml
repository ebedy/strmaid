name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross_linker: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            install_musl: true
            use_cross_linker: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            install_aarch64: true
            target_linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux musl tools
        if: matrix.install_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Linux ARM64 cross compiler
        if: matrix.install_aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target_linker }}

      - name: Package archive and compute checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p staging dist
          if [ -f "target/${{ matrix.target }}/release/strmaid.exe" ]; then
            cp "target/${{ matrix.target }}/release/strmaid.exe" staging/
            cp README.md LICENSE-* staging/ 2>/dev/null || true
            ARCHIVE="strmaid-v${VERSION}-${{ matrix.target }}.zip"
            if command -v 7z >/dev/null 2>&1; then
              7z a "${ARCHIVE}" ./staging/*
            else
              tar -czf "${ARCHIVE}" -C staging .
            fi
          else
            cp "target/${{ matrix.target }}/release/strmaid" staging/
            cp README.md LICENSE-* staging/ 2>/dev/null || true
            ARCHIVE="strmaid-v${VERSION}-${{ matrix.target }}.tar.gz"
            tar -czf "${ARCHIVE}" -C staging .
          fi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          mv "${ARCHIVE}" "${ARCHIVE}.sha256" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd all-artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to Crates.io
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || vars.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::Secret ou Variable CARGO_REGISTRY_TOKEN non défini dans le dépôt GitHub !"
            exit 1
          fi
          echo "Token Crates.io détecté avec succès."

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || vars.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
